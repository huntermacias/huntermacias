<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 90" width="1200" height="90" role="img" aria-labelledby="t d">
<title id="t">Build, measure, learn, repeat</title><desc id="d">A restrained animated signal closing the profile.</desc>
<style>
 text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;}
 .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
 .pulse{animation:pulse 3.4s ease-in-out infinite; transform-origin:center;}
 .blink{animation:blink 2.4s ease-in-out infinite;}
 .trace{stroke-dasharray:9 14;animation:dash 13s linear infinite;}
 .sweep{animation:sweep 8s ease-in-out infinite;}
 .rise{animation:rise 4.6s ease-in-out infinite;}
 @keyframes pulse{0%,100%{opacity:0.42}50%{opacity:1}}
 @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
 @keyframes dash{to{stroke-dashoffset:-230}}
 @keyframes sweep{0%{opacity:0}15%{opacity:.60}55%{opacity:.20}100%{opacity:0}}
 @keyframes rise{0%,100%{opacity:0.45}45%{opacity:0.95}}
 @media (prefers-reduced-motion:reduce){.pulse,.blink,.trace,.sweep,.rise{animation:none}}
</style><rect x="1" y="1" width="1198" height="88" rx="12" fill="#0A0F17" stroke="#2A394B" stroke-width="2"/><text x="36" y="53" fill="#F1F5FB" font-size="18" font-weight="600" class="mono">BUILD  /  MEASURE  /  LEARN  /  REPEAT</text><line x1="630" y1="46" x2="1138" y2="46" stroke="#2A394B" stroke-width="2" opacity="1"/><path d="M630 46 L755 46 L778 33 L798 59 L820 46 L940 46 L967 27 L993 65 L1017 46 L1138 46" stroke="#66CDBA" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none" class="trace"/><circle cx="967" cy="27" r="4" fill="#8891FF" stroke="none" stroke-width="1" class="pulse"/></svg>